<!doctype html>
<meta charset="utf-8">
<title>Crewser</title>
<style>
  :root {
    --bg: #0a0a0a; --elevated: #1a1a1a; --border: #262626; --border-strong: #383838;
    --fg: #fafafa; --muted: #a1a1a1; --accent: #b7f34c; --accent-fg: #0a0a0a;
    --warn: #e5c07b; --danger: #e06c75; --ok: #7cd992;
    --radius: 14px; --motion: 120ms cubic-bezier(0.2, 0, 0, 1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 20px; border-bottom: 1px solid var(--border); flex: none;
  }
  header img { width: 24px; height: 24px; border-radius: 6px; }
  header .name { font-weight: 650; letter-spacing: -0.01em; }
  header .spacer { flex: 1; }
  select, input, button, textarea { font: inherit; color: inherit; }
  select, .field {
    background: var(--elevated); border: 1px solid var(--border);
    border-radius: 999px; padding: 8px 12px; min-height: 36px;
    transition: border-color var(--motion);
  }
  select:hover, .field:hover { border-color: var(--border-strong); }
  .icon-btn {
    background: transparent; border: 1px solid transparent; border-radius: 999px;
    width: 36px; height: 36px; cursor: pointer; color: var(--muted);
    display: grid; place-items: center; transition: all var(--motion);
  }
  .icon-btn:hover { background: #ffffff10; color: var(--fg); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  main { flex: 1; overflow-y: auto; padding: 24px 20px; }
  .wrap { max-width: 760px; margin: 0 auto; }

  .hero { text-align: center; padding: 48px 0 32px; }
  .hero img { width: 56px; height: 56px; border-radius: 14px; margin-bottom: 20px; }
  .hero h1 { font-size: 30px; margin: 0 0 8px; letter-spacing: -0.02em; font-weight: 650; }
  .hero p { color: var(--muted); margin: 0 auto; max-width: 460px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 24px; }
  .chip {
    background: var(--elevated); border: 1px solid var(--border); color: var(--fg);
    border-radius: 999px; padding: 8px 14px; cursor: pointer; min-height: 36px;
    transition: all var(--motion);
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }

  .msg { margin-bottom: 18px; display: flex; gap: 12px; }
  .msg .who {
    flex: none; width: 26px; height: 26px; border-radius: 8px; display: grid;
    place-items: center; font-size: 11px; font-weight: 700; margin-top: 2px;
  }
  .msg.user .who { background: var(--border-strong); }
  .msg.agent .who { background: var(--accent); color: var(--accent-fg); }
  .msg .body { flex: 1; min-width: 0; white-space: pre-wrap; word-wrap: break-word; }

  .step {
    border-left: 2px solid var(--border-strong); padding: 4px 0 4px 12px;
    margin: 6px 0; color: var(--muted); font-size: 13px;
  }
  .step b { color: var(--fg); font-weight: 600; }
  .step.err { border-color: var(--danger); color: var(--danger); }
  .step.ok  { border-color: var(--ok); }

  footer { flex: none; border-top: 1px solid var(--border); padding: 14px 20px; }
  .composer { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; background: var(--elevated); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px 14px; resize: none; min-height: 46px;
    max-height: 160px; transition: border-color var(--motion);
  }
  textarea:hover { border-color: var(--border-strong); }
  .send {
    background: var(--accent); color: var(--accent-fg); border: none; cursor: pointer;
    border-radius: 999px; width: 46px; height: 46px; font-size: 17px; flex: none;
    transition: filter var(--motion);
  }
  .send:hover:not(:disabled) { filter: brightness(1.1); }
  .send:disabled { opacity: 0.45; cursor: not-allowed; }

  dialog {
    background: var(--elevated); color: var(--fg); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 24px; max-width: 460px; width: 92%;
  }
  dialog::backdrop { background: #000000aa; }
  dialog h2 { margin: 0 0 4px; font-size: 17px; }
  dialog .hint { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
  label { display: block; margin-bottom: 14px; }
  label span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  label input {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; min-height: 40px;
  }
  .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }
  .btn {
    border-radius: 999px; padding: 9px 18px; min-height: 40px; cursor: pointer;
    border: 1px solid var(--border); background: transparent; transition: all var(--motion);
  }
  .btn:hover { border-color: var(--border-strong); }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.1); }
  .status { font-size: 12px; color: var(--muted); }
</style>

<header>
  <img src="icon/128.png" alt="">
  <span class="name">Crewser</span>
  <span class="spacer"></span>
  <span class="status" id="status"></span>
  <select id="model" aria-label="Model">
    <option value="cloud">Qwen · Cloud</option>
    <option value="local">Qwen · Local</option>
  </select>
  <button class="icon-btn" id="settingsBtn" aria-label="Settings" title="Settings">⚙</button>
</header>

<main>
  <div class="wrap" id="thread">
    <div class="hero" id="hero">
      <img src="icon/128.png" alt="">
      <h1>What should I do?</h1>
      <p>Give me a task and I'll work through it in this browser — reading pages, clicking, typing and navigating for you.</p>
      <div class="chips">
        <button class="chip" data-task="Summarise the page in the active tab">Summarise this page</button>
        <button class="chip" data-task="Search Google for the current weather and tell me the result">Search the web</button>
        <button class="chip" data-task="List every link on the current page with its text">Extract links</button>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Give Crewser a task…" aria-label="Task"></textarea>
    <button class="send" id="send" aria-label="Run task">↑</button>
  </div>
</footer>

<dialog id="settings">
  <h2>Models</h2>
  <p class="hint">Crewser runs on Qwen — cloud through OpenRouter, or the local server on this Mac.</p>
  <label>
    <span>OpenRouter API key (cloud)</span>
    <input type="password" id="apiKey" placeholder="sk-or-v1-…" autocomplete="off">
  </label>
  <label>
    <span>Cloud model id</span>
    <input type="text" id="cloudModel" placeholder="qwen/qwen3-vl-8b-instruct">
  </label>
  <label>
    <span>Local server base URL</span>
    <input type="text" id="localUrl" placeholder="http://127.0.0.1:8081/v1">
  </label>
  <label>
    <span>Local model id</span>
    <input type="text" id="localModel" placeholder="mlx-community/Qwen3-VL-4B-Instruct-4bit">
  </label>
  <div class="row">
    <button class="btn" id="cancelSettings">Cancel</button>
    <button class="btn primary" id="saveSettings">Save</button>
  </div>
</dialog>

<script src="crewser-cockpit.js"></script>
